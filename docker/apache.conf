ServerName localhost
ServerTokens Prod
ServerSignature Off

<LocationMatch "^/uploads(?:/|$)">
    Require all denied
</LocationMatch>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(koneksi|auth)\.php$">
        Require all denied
    </FilesMatch>
</Directory>
